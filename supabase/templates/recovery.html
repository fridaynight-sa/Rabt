<div dir="rtl" style="font-family: Tahoma, Arial, sans-serif; line-height: 1.8; color: #0f172a">
  <h2 style="color: #1c625b">تغيير كلمة المرور</h2>
  <p>طلبت تغيير كلمة المرور لحسابك في ربط. اضغط الزر عشان تختار كلمة مرور جديدة:</p>
  <p>
    <a
      href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
      style="
        background: #1c625b;
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
      "
      >اختيار كلمة مرور جديدة</a
    >
  </p>
  <p style="color: #64748b; font-size: 13px">
    إذا ما طلبت هذا، تجاهل الرسالة وكلمة مرورك ما راح تتغير.
  </p>
</div>
