<div dir="rtl" style="font-family: Tahoma, Arial, sans-serif; line-height: 1.8; color: #0f172a">

  <p>طلبت تغيير إيميل حسابك في ربط إلى {{ .NewEmail }}. اضغط الزر عشان تأكد:</p>
  <p>
    <a

        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
      "

</div>
